# ============================================
# General Settings
# ============================================

set-option -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -g history-limit 10000
set-option -g mouse on
set-option -sg escape-time 0
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g focus-events on
set-option -g status-keys vi
set-window-option -g mode-keys vi

# ============================================
# Prefix and Keybindings
# ============================================

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind S setw synchronize-panes \; display-message "Pane sync #{?synchronize-panes,ON,OFF}"

# ============================================
# Vi-Mode Copy/Paste
# ============================================

unbind [
bind Escape copy-mode

unbind p
bind p paste-buffer

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# ============================================
# Visual Design - Stripe-Inspired Theme
# ============================================

set-option -g status-style bg=#0d1117,fg=#c9d1d9
set-option -g status-left-length 50
set-option -g status-right-length 150

set-option -g pane-border-style fg=#30363d
set-option -g pane-active-border-style fg=#635bff

set-option -g message-style bg=#635bff,fg=#ffffff
set-option -g message-command-style bg=#635bff,fg=#ffffff

set-window-option -g window-status-style fg=#8b949e
set-window-option -g window-status-current-style fg=#ffffff,bg=#635bff,bold

set-option -g status-left "#[fg=#ffffff,bg=#635bff,bold] #S #[fg=#635bff,bg=#0d1117]"

set-option -g status-right "#{?client_prefix,#[fg=#ffffff]#[bg=#1f6feb] PREFIX #[fg=#1f6feb]#[bg=#0d1117] ,}#{?SSH_CLIENT,#[fg=#ffffff]#[bg=#f85149] SSH: #h #[fg=#f85149]#[bg=#0d1117] ,}#[fg=#8b949e] %Y-%m-%d #[fg=#c9d1d9]%H:%M #[fg=#ffffff,bg=#30363d] #h "

set-window-option -g window-status-format " #I: #W "
set-window-option -g window-status-current-format " #I: #W "

# ============================================
# SSH Detection
# ============================================

set-option -g update-environment "DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY SSH_CLIENT"

run-shell 'tmux setenv -g SSH_CLIENT "$SSH_CLIENT"'

# ============================================
# Plugins via TPM (Tmux Plugin Manager)
# ============================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'

run '~/.tmux/plugins/tpm/tpm'
